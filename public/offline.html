<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Money Manager — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0b1329;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
        width: 100%;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 20px;
        display: block;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 10px;
        color: #f1f5f9;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      button {
        background: #1565C0;
        color: #fff;
        border: none;
        padding: 14px 28px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 6px 20px rgba(21,101,192,0.4);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="icon">📡</span>
      <h1>You're Offline</h1>
      <p>Money Manager works offline once you've visited before. Make sure the app is installed or try reconnecting.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
