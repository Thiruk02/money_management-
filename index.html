<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Money Manager</title>
    <meta name="description" content="Track your cash and UPI/online banking separately. Know exactly how much physical cash and digital money you have at all times." />

    <!-- PWA / Theme -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS / Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money Mgr" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

    <!-- Open Graph (share preview) -->
    <meta property="og:title" content="Money Manager" />
    <meta property="og:description" content="Track cash and UPI/banking separately." />
    <meta property="og:image" content="./icon.png" />
    <meta property="og:type" content="website" />

    <!-- Preconnect to icon CDN for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then((reg) => {
              console.log('[SW] Registered:', reg.scope);

              // Notify app when a new SW is waiting to activate
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New SW is ready — dispatch event so the app can show toast
                    window.dispatchEvent(new CustomEvent('sw-update-available', { detail: reg }));
                  }
                });
              });
            })
            .catch((err) => console.error('[SW] Registration failed:', err));

          // If a new SW takes control, reload to get fresh assets
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
